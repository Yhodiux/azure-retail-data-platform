[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-data-core"
version = "0.1.0"
description = "Portable Olist PySpark transformation baseline"
requires-python = ">=3.8,<3.12"
dependencies = []

[project.optional-dependencies]
local-test = ["pyspark==3.5.4"]

[tool.setuptools.packages.find]
where = ["src"]
